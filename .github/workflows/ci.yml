name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: lint and type-check
        run: |
          pip install ruff mypy
          ruff check src/ tests/ scripts/ examples/ demo.py
          mypy src/ledgerguard --ignore-missing-imports
      - name: README numbers match results/
        run: python scripts/sync_readme.py --check
      - name: end-to-end CLI check
        run: |
          ledgerguard generate --vouchers 200 --seed 1 -o ledger.json
          ledgerguard anchor ledger.json --batch-size 50
          ledgerguard verify ledger.json
          ledgerguard benchmark --vouchers 200 --seed 1
      - name: experiment harness smoke test
        # --runs 2 so the cross-run aggregation path, not just its unit
        # tests, runs on every push; in quick mode it adds a few seconds.
        run: python scripts/experiments.py --quick --runs 2 --out /tmp/results

  core-without-optional-deps:
    # The core must install and pass with no third-party packages at all;
    # the EVM tests skip themselves when web3 is absent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: pytest -q
      - name: frozen wire-format vectors
        run: pytest -q tests/test_vectors.py

  package:
    # Every other job installs editable, which never exercises the wheel
    # build. 0.6.3 shipped with a pyproject defect that broke every
    # non-editable install and no job noticed; this one exists so that the
    # path users actually take -- pip install, a built wheel -- stays green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build a real wheel
        run: pip wheel . -w dist/ --no-deps
      - name: install it and smoke-test the CLI
        run: |
          pip install dist/*.whl
          python -c "import ledgerguard; print(ledgerguard.__version__)"
          python -c "import importlib.resources as r; assert r.files('ledgerguard').joinpath('artifacts/AnchorRegistry.json').is_file(), 'contract artifact missing from wheel'"
          ledgerguard generate --vouchers 50 --seed 1 -o ledger.json
          ledgerguard anchor ledger.json --batch-size 25
          ledgerguard verify ledger.json

  docker:
    # The Dockerfile promises a one-command evaluation. Three audit
    # rounds never built the image -- their sandbox had no Docker
    # daemon -- so this job builds it and runs the suite inside on
    # every push, keeping that promise checked rather than assumed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ledgerguard .
      - run: docker run --rm ledgerguard

  mutants:
    # Slow, so it runs once rather than across the matrix. A surviving mutant
    # means the suite grew a blind spot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/mutate.py

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install solc
        run: |
          curl -sL -o /usr/local/bin/solc \
            https://github.com/ethereum/solidity/releases/download/v0.8.24/solc-static-linux
          chmod +x /usr/local/bin/solc
      - name: verify the committed artifact matches the source
        run: python scripts/compile_contract.py --check
